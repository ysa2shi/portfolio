name: Scheduled Deploy to Cloudflare Workers
run-name: 🕒 本番環境へ定期デプロイ

on:
  # 定期実行（毎週月曜・木曜の10:00 JST = 1:00 UTC）
  schedule:
    - cron: '0 1 * * 1'  # 月曜日 1:00 UTC (10:00 JST)
    - cron: '0 1 * * 4'  # 木曜日 1:00 UTC (10:00 JST)

  # 手動実行も可能にする
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Workers Builds の Deploy Hook を叩いて main をビルド・デプロイする
      - name: Trigger Workers Builds deploy hook
        run: curl -fsS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
