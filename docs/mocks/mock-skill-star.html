<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mock — スキルの星</title>
<style>
  :root { --bg:#fdfcfa; --ink:#1d2a3a; --sub:#5b6676; --line:#e6e2da; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:64px 20px 96px; }
  .note { font-size:11px; color:var(--sub); margin-bottom:28px; }
  h2 { font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:600; font-size:clamp(28px,4.4vw,44px); margin:0 0 10px; }
  p.lead { margin:0 0 20px; color:var(--sub); line-height:1.9; font-size:15px; max-width:560px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin:0 0 6px; font-size:12.5px; color:var(--sub); }
  .legend button { font:inherit; color:inherit; background:none; border:0; padding:4px 0; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .legend button:hover, .legend button:focus-visible { color:var(--ink); }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .tiers { gap:16px; margin-bottom:10px; }
  .tiers span { display:inline-flex; align-items:center; gap:7px; }
  .tiers .t1 i { width:16px; height:16px; border-radius:0; background:#1d2a3a; clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%); }
  .tiers .t2 i { width:9px; height:9px; background:#1d2a3a; }
  .tiers .t3 i { width:9px; height:9px; background:transparent; border:1.5px solid #1d2a3a; }

  .sky { position:relative; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  .star { fill:#b9b2a3; animation:tw 4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.75 } }
  .guide { fill:none; stroke:#e6e1d6; stroke-width:1; }
  .edge { fill:none; stroke:#1d2a3a; stroke-width:.9; opacity:.28; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.2s ease-out forwards; animation-delay:calc(.6s + var(--i) * .04s); transition:opacity .3s; }
  @keyframes draw { to { stroke-dashoffset:0 } }
  .node { cursor:pointer; opacity:0; animation:fade .5s ease forwards; animation-delay:calc(var(--i) * .07s); outline:none; }
  @keyframes fade { to { opacity:1 } }
  .node .pop { transform-box:fill-box; transform-origin:center; animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both; animation-delay:calc(var(--i) * .07s); transition:opacity .3s; }
  @keyframes pop { from { transform:scale(.4) } to { transform:scale(1) } }
  .node .body { transform-box:fill-box; transform-origin:center; transition:transform .35s cubic-bezier(.2,.9,.3,1.3); }
  .node:hover .body, .node:focus-visible .body, .node.on .body { transform:scale(1.18); }
  .node text { font-size:12px; fill:#1d2a3a; text-anchor:middle; font-weight:500; letter-spacing:.06em; pointer-events:none; }
  .node:focus-visible .halo { stroke:#1d2a3a; stroke-width:1.5; opacity:1; }
  svg[data-active] .edge.dim { opacity:.1; }
  svg[data-active] .edge.on { opacity:.9; stroke-width:1.7; }
  svg[data-active] .node.dim .pop { opacity:.18; }
  .detail { min-height:64px; margin-top:6px; font-size:14px; color:var(--sub); line-height:1.8; }
  .detail b { color:var(--ink); font-weight:600; margin-right:8px; }

  .fallback { display:none; }
  .fallback h3 { font-size:15px; margin:18px 0 6px; }
  .fallback ul { margin:0; padding-left:1.2em; color:var(--sub); line-height:1.9; font-size:14px; }
  @media (max-width: 640px) { .sky, .legend, .detail { display:none; } .fallback { display:block; } }
  @media (prefers-reduced-motion: reduce) { .star, .edge, .node, .node .pop { animation:none; opacity:1; stroke-dashoffset:0; } .edge { opacity:.28; } .node .body { transition:none; } }
</style>
</head>
<body>
<main>
  <div class="note">Mock / スキルの星（イメージ。色・全体方針は未確定。分類とつながりは仮置き）</div>
  <h2>Skills</h2>
  <p class="lead">技術どうしのつながりを星座のように並べました。星に触れると、一緒に使っているものが浮かび上がります。</p>
  <div class="legend" id="legend"></div>
  <div class="legend tiers"><span class="t1"><i></i>主戦力</span><span class="t2"><i></i>実務で使用</span><span class="t3"><i></i>試している</span></div>

  <div class="sky"><svg id="sky" viewBox="0 0 1000 560" role="group" aria-label="スキルの関係図"></svg></div>
  <div class="detail" id="detail" aria-live="polite">星に触れてみてください。</div>

  <div class="fallback" id="fallback"></div>
</main>

<script>
(() => {
  const CATS = { Frontend: '#2f43c4', Backend: '#e2512d', Database: '#5f8f3a', Infra: '#8a3a8c', Tools: '#e3a008' };
  // tier: 1=主戦力 2=実務 3=試している（分類は仮）
  const NODES = [
    ['TypeScript', 'Frontend', 1, 220, 140], ['React', 'Frontend', 2, 110, 235], ['Vue.js', 'Frontend', 2, 300, 255],
    ['Astro', 'Frontend', 3, 410, 115], ['Tailwind CSS', 'Frontend', 2, 195, 345],
    ['Cloudflare', 'Infra', 3, 545, 205], ['GitHub', 'Tools', 2, 705, 120], ['GitHub Actions', 'Tools', 1, 695, 255],
    ['Docker', 'Infra', 2, 480, 355], ['AWS', 'Infra', 1, 330, 450],
    ['DynamoDB', 'Database', 2, 470, 500], ['MySQL', 'Database', 2, 610, 470],
    ['Spring Boot', 'Backend', 1, 745, 400], ['Java', 'Backend', 2, 880, 320], ['Kotlin', 'Backend', 1, 890, 450], ['Ktor', 'Backend', 2, 790, 515],
  ];
  const EDGES = [
    ['TypeScript','Astro'],['TypeScript','React'],['TypeScript','Vue.js'],['React','Tailwind CSS'],['Astro','Tailwind CSS'],['Vue.js','Tailwind CSS'],
    ['Astro','Cloudflare'],['Cloudflare','GitHub Actions'],['GitHub','GitHub Actions'],['GitHub Actions','Docker'],
    ['Docker','AWS'],['Docker','Spring Boot'],['AWS','DynamoDB'],['Spring Boot','MySQL'],['Ktor','DynamoDB'],
    ['Java','Spring Boot'],['Java','Kotlin'],['Kotlin','Ktor'],['Kotlin','Spring Boot'],['MySQL','DynamoDB'],
  ];
  const TIER = { 1: '主戦力', 2: '実務で使用', 3: '試している' };
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('sky'), detail = document.getElementById('detail');
  const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const byName = Object.fromEntries(NODES.map((n, i) => [n[0], { name: n[0], cat: n[1], tier: n[2], x: n[3], y: n[4], i, nb: new Set() }]));
  EDGES.forEach(([a, b]) => { byName[a].nb.add(b); byName[b].nb.add(a); });

  // 星図の補助線（同心円と十字）
  const guide = el('g', {}, svg);
  [150, 290, 430].forEach(r => el('circle', { class: 'guide', cx: 500, cy: 300, r }, guide));
  el('line', { class: 'guide', x1: 0, y1: 300, x2: 1000, y2: 300 }, guide);
  el('line', { class: 'guide', x1: 500, y1: 0, x2: 500, y2: 560 }, guide);

  // 背景の小さな星
  const stars = el('g', {}, svg);
  for (let i = 0; i < 70; i++) {
    const s = el('circle', { class: 'star', cx: Math.random() * 1000, cy: Math.random() * 560, r: Math.random() * 1.3 + .4 }, stars);
    s.style.animationDelay = (Math.random() * 4) + 's';
  }

  // 線（少し湾曲させて有機的に）
  const edgeEls = [];
  EDGES.forEach(([a, b], i) => {
    const A = byName[a], B = byName[b], mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy), off = ((i % 2) ? 1 : -1) * len * 0.06;
    const p = el('path', { class: 'edge', d: `M${A.x},${A.y} Q${mx - dy / len * off},${my + dx / len * off} ${B.x},${B.y}`, pathLength: 1 }, svg);
    p.style.setProperty('--i', i); edgeEls.push({ p, a, b });
  });

  // 星（ノード）。位置・出現・ホバーは入れ子の別要素に分けて、transform の競合を避ける
  const nodeEls = {};
  const RAD = { 1: 14, 2: 8, 3: 7 };
  for (const n of Object.values(byName)) {
    const g = el('g', { class: 'node', tabindex: 0, role: 'button', 'aria-label': `${n.name}（${n.cat}、${TIER[n.tier]}）`, transform: `translate(${n.x} ${n.y})` }, svg);
    g.style.setProperty('--i', n.i);
    const pop = el('g', { class: 'pop' }, g), body = el('g', { class: 'body' }, pop), r = RAD[n.tier], col = CATS[n.cat];
    el('circle', { class: 'halo', r: r + 7, fill: 'none', stroke: col, 'stroke-width': 1, opacity: n.tier === 1 ? .5 : 0 }, body);
    if (n.tier === 1) el('path', { d: `M0,${-r * 1.35} Q0,0 ${r * 1.35},0 Q0,0 0,${r * 1.35} Q0,0 ${-r * 1.35},0 Q0,0 0,${-r * 1.35}Z`, fill: col }, body);
    else if (n.tier === 2) el('circle', { r, fill: col }, body);
    else el('circle', { r, fill: '#fdfcfa', stroke: col, 'stroke-width': 2 }, body);
    const t = el('text', { y: r + 20 }, pop); t.textContent = n.name;
    nodeEls[n.name] = g;
    g.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') preview(n.name); });
    g.addEventListener('pointerleave', () => preview(null));
    g.addEventListener('focus', () => preview(n.name));
    g.addEventListener('blur', () => preview(null));
    g.addEventListener('click', () => pin(n.name));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pin(n.name); } });
  }

  // 強調表示
  let pinned = null, hovered = null, catSel = null;
  function apply() {
    const id = hovered || pinned;
    let on = null;
    if (id) on = new Set([id, ...byName[id].nb]);
    else if (catSel) on = new Set(Object.values(byName).filter(n => n.cat === catSel).map(n => n.name));
    if (on) svg.setAttribute('data-active', ''); else svg.removeAttribute('data-active');
    for (const [name, g] of Object.entries(nodeEls)) { const f = on && on.has(name); g.classList.toggle('dim', !!on && !f); g.classList.toggle('on', !!id && name === id); }
    edgeEls.forEach(({ p, a, b }) => { const f = id ? (a === id || b === id) : (on && on.has(a) && on.has(b)); p.classList.toggle('on', !!f); p.classList.toggle('dim', !!on && !f); });
    if (id) { const n = byName[id]; detail.innerHTML = `<b>${n.name}</b>${n.cat} ／ ${TIER[n.tier]}<br>つながり: ${[...n.nb].join('、') || '—'}`; }
    else if (catSel) detail.innerHTML = `<b>${catSel}</b>${Object.values(byName).filter(n => n.cat === catSel).map(n => n.name).join('、')}`;
    else detail.textContent = '星に触れてみてください。';
  }
  const preview = id => { hovered = id; apply(); };
  const pin = id => { pinned = pinned === id ? null : id; apply(); };

  // 凡例（カテゴリで絞り込み）
  const legend = document.getElementById('legend');
  for (const [c, col] of Object.entries(CATS)) {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<i style="background:${col}"></i>${c}`;
    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { catSel = c; apply(); } });
    b.addEventListener('pointerleave', () => { catSel = null; apply(); });
    b.addEventListener('focus', () => { catSel = c; apply(); });
    b.addEventListener('blur', () => { catSel = null; apply(); });
    legend.appendChild(b);
  }

  // 小さい画面では、通常のリスト表示に切り替える（情報には常に到達できる）
  const fb = document.getElementById('fallback');
  for (const c of Object.keys(CATS)) {
    const list = Object.values(byName).filter(n => n.cat === c);
    fb.insertAdjacentHTML('beforeend', `<h3>${c}</h3><ul>${list.map(n => `<li>${n.name}（${TIER[n.tier]}）</li>`).join('')}</ul>`);
  }
})();
</script>
</body>
</html>
